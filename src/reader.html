<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' moyue-app: moyue-book: data: blob:; script-src 'self' moyue-app: 'unsafe-inline'; style-src 'self' moyue-app: 'unsafe-inline'; img-src 'self' moyue-app: moyue-book: data: blob:; font-src 'self' moyue-app: data:; connect-src 'self' moyue-app: moyue-book: data: blob:; worker-src 'self' moyue-app: blob:"/>
  <title>墨阅 · 阅读</title>
  <link rel="stylesheet" href="/src/css/reader.css"/>
</head>
<body>
  <div id="app">
    <!-- 顶栏（常驻显示，不自动隐藏） -->
    <header id="toolbar">
      <button id="btnBack" class="tbtn" title="返回书架 (Esc)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div id="bookTitle" class="toolbar-title">加载中…</div>
      <div class="toolbar-spacer"></div>
      <button id="btnToc" class="tbtn" title="目录 (T)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>
      <button id="btnHighlight" class="tbtn" title="荧光笔标注 (H)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
      </button>
      <button id="btnNotes" class="tbtn" title="我的批注 (N)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
      </button>
      <button id="btnTheme" class="tbtn" title="切换主题 (M)">
        <span id="themeIcon">☀</span>
      </button>
      <button id="btnType" class="tbtn" title="版式设置 (F)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 18L9 6l5 12M6 14h6"/><path d="M16 18l3-7 3 7M17.2 15.5h3.6"/></svg>
      </button>
      <button id="btnBookmark" class="tbtn" title="添加书签 (Ctrl+B)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
      </button>
      <button id="btnFullscreen" class="tbtn" title="全屏 (F11)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 00-2 2v3M16 3h3a2 2 0 012 2v3M8 21H5a2 2 0 01-2-2v-3M16 21h3a2 2 0 012-2v-3"/></svg>
      </button>
    </header>

    <!-- 主体 -->
    <div id="body">
      <!-- 目录 / 书签侧栏（默认收起，保持沉浸式阅读） -->
      <aside id="sidePanel" class="hidden">
        <div class="panel-tabs">
          <button id="tabToc" class="panel-tab active">目录</button>
          <button id="tabMarks" class="panel-tab">书签</button>
        </div>
        <div id="tocList" class="panel-list"></div>
        <div id="markList" class="panel-list" hidden></div>
      </aside>

      <!-- 阅读舞台 -->
      <main id="stage">
        <div id="epubView" class="format-view" hidden></div>
        <div id="pdfView" class="format-view" hidden>
          <div id="pdfPages"></div>
          <div id="pdfControls" class="pdf-controls">
            <button id="pdfZoomOut" class="pbtn" title="缩小">−</button>
            <span id="pdfZoomLabel">100%</span>
            <button id="pdfZoomIn" class="pbtn" title="放大">＋</button>
            <button id="pdfFitWidth" class="pbtn" title="适应宽度">宽</button>
          </div>
        </div>
        <div id="textView" class="format-view" hidden>
          <div id="textContent"></div>
        </div>

        <!-- 翻页箭头（WPS 风格：贴边隐藏，鼠标靠近时浮现） -->
        <button id="arrowPrev" class="page-arrow left" title="上一页 (←)">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button id="arrowNext" class="page-arrow right" title="下一页 (→)">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg>
        </button>

        <!-- 双页书脊（中缝阴影），仅在双页模式显示 -->
        <div id="spine"></div>

        <div id="loading" class="loading">
          <div class="loading-ink">墨</div>
          <p id="loadingText">正在打开图书…</p>
        </div>
        <div id="errorBox" class="error-box" hidden>
          <h3>无法打开这本书</h3>
          <p id="errorText"></p>
          <button id="errorBack" class="btn">返回书架</button>
        </div>
      </main>

      <!-- 标注抽屉（书籍右侧空白处的批注管理） -->
      <aside id="annPanel" class="hidden">
        <div class="ann-head">
          <span class="ann-title">标注与批注</span>
          <button id="annExport" class="ann-export" title="导出为 Markdown">导出</button>
          <button id="annClose" class="tbtn small" title="关闭">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div id="annList" class="ann-list"></div>
      </aside>
    </div>

    <!-- 状态栏（常驻显示） -->
    <footer id="statusbar">
      <span id="statusChapter">—</span>
      <span class="status-sep">·</span>
      <span id="statusPage">—</span>
      <span class="status-spacer"></span>
      <span id="statusPercent">0%</span>
      <span class="status-sep">·</span>
      <span id="statusTheme">日间</span>
      <span class="status-sep">·</span>
      <span id="statusClock"></span>
    </footer>

    <!-- 荧光笔颜色面板 -->
    <div id="hlPalette" class="hl-palette" hidden>
      <div class="hl-palette-title">荧光笔</div>
      <div class="hl-palette-dots">
        <button class="hl-dot" data-color="red" style="background:#e05252" title="红色"></button>
        <button class="hl-dot" data-color="orange" style="background:#e88a2e" title="橙色"></button>
        <button class="hl-dot" data-color="yellow" style="background:#e8bd2a" title="黄色"></button>
        <button class="hl-dot" data-color="green" style="background:#3f9e63" title="绿色"></button>
        <button class="hl-dot" data-color="blue" style="background:#3f7fd4" title="蓝色"></button>
        <button class="hl-dot" data-color="purple" style="background:#8a63c9" title="紫色"></button>
      </div>
      <div class="hl-palette-hint">选中文字后点颜色即可标注<br/>再次点颜色可改色</div>
      <button id="hlManage" class="hl-manage">管理全部标注 →</button>
    </div>

    <!-- 版式设置弹层 -->
    <div id="typePanel" class="type-panel" hidden>
      <div class="type-row">
        <span class="type-label">字号</span>
        <button id="fontMinus" class="tbtn small">−</button>
        <span id="fontSizeLabel" class="type-value">18px</span>
        <button id="fontPlus" class="tbtn small">＋</button>
      </div>
      <div class="type-row">
        <span class="type-label">行距</span>
        <div class="seg" id="lineHeightSeg">
          <button data-v="1.4">紧</button>
          <button data-v="1.6">适中</button>
          <button data-v="1.8" class="active">宽</button>
          <button data-v="2.0">舒</button>
        </div>
      </div>
      <div class="type-row">
        <span class="type-label">字体</span>
        <div class="seg" id="fontFamilySeg">
          <button data-v="system">系统</button>
          <button data-v="song" class="active">宋体</button>
          <button data-v="hei">黑体</button>
          <button data-v="kai">楷体</button>
          <button data-v="times">Times</button>
        </div>
      </div>
      <div class="type-row">
        <span class="type-label">边距</span>
        <input id="marginRange" type="range" min="24" max="180" step="8" value="64"/>
        <span id="marginLabel" class="type-value">64px</span>
      </div>
      <div class="type-row" id="pageModeRow">
        <span class="type-label">版式</span>
        <div class="seg" id="pageModeSeg">
          <button data-v="single">单页</button>
          <button data-v="dual" class="active">双页</button>
          <button data-v="scroll">滚动</button>
        </div>
      </div>
      <div class="type-row" id="turnFxRow">
        <span class="type-label">翻页</span>
        <div class="seg" id="turnFxSeg">
          <button data-v="slide" class="active">滑动</button>
          <button data-v="fade">淡入</button>
          <button data-v="none">无</button>
        </div>
      </div>
      <div class="type-hint">← → 翻页 · T 目录 · M 主题 · F 版式 · H 荧光笔 · N 批注 · Ctrl+B 书签 · F11 全屏<br/>鼠标移到左右边缘会出现箭头，点箭头翻页；正文可自由划词批注，不会误翻页</div>
    </div>
  </div>

  <!-- epub.js 的任务队列依赖 requestAnimationFrame；窗口隐藏/最小化时 Chromium 会停发 rAF，
       导致渲染流水线卡死。这里用 setTimeout 兜底，保证任何窗口状态下都能翻页渲染。 -->
  <script>
    (function () {
      window.requestAnimationFrame = function (cb) { return setTimeout(function () { cb(Date.now()); }, 16); };
      window.cancelAnimationFrame = function (id) { clearTimeout(id); };
    })();
  </script>
  <script src="/src/vendor/jszip.min.js"></script>
  <script src="/src/vendor/epub.js"></script>
  <script type="module" src="/src/js/reader.js"></script>
</body>
</html>
